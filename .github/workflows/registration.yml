# Registration bot for the .ion root zone.
#
# Triggered by a new or edited registration issue, and periodically as a
# safety net for missed events. The script validates the signature, applies
# the 48-hour rule, commits the zone files and closes the issue.
#
# Every run applies the issue that triggered it and then sweeps the other
# open registrations. GitHub keeps only one pending run per concurrency
# group, so if a burst of issues cancels the queued runs, the run that wins
# still drains the whole queue. All sweep changes are pushed as one commit.
name: registration

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    # Sweep open registration issues every six hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Only one writer may touch the ledger and zone files at a time.
  group: ion-registrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the zone repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Use a fine-grained token when main is protected. Otherwise the
          # workflow token is enough. See README.md.
          token: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Apply the issue that triggered this run
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/zone_admin.py apply --root . --event "$GITHUB_EVENT_PATH"

      # Runs even when the single-issue step failed, so one bad issue cannot
      # block the rest of the queue.
      - name: Sweep the remaining open registration issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/zone_admin.py sweep --root . --comment-errors
