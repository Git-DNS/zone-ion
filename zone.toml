schema = 1
zone = "ion"
description = "The .ion is a test zone for GitDNS."
default_ttl = 300
negative_ttl = 60
policy = "open"
allowed_types = ["A", "AAAA", "CNAME", "TXT", "MX", "NS", "SRV", "CAA", "PTR"]
ns = ["ns1.ion", "ns2.ion"]

[soa]
mname = "ns1.ion"
rname = "hostmaster.ion"
serial = 6
refresh = 3600
retry = 600
expire = 604800
minimum = 60
